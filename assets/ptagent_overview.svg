<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="1000" viewBox="0 0 1680 1000" role="img" aria-labelledby="title desc">
  <title id="title">PTagent contract-mediated workflow</title>
  <desc id="desc">PTagent routes paper, SARAH Vevacious++, DRalgo 3DEFT, and existing contract inputs through deterministic import, human contract review, validation, and compilation to CosmoTransitions or PhaseTracer.</desc>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#3d4a57"/>
    </marker>
    <marker id="arrow-paper" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#137c78"/>
    </marker>
    <marker id="arrow-sarah" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#b45f32"/>
    </marker>
    <marker id="arrow-3d" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#4d63a8"/>
    </marker>
    <style>
      .title { font: 700 34px Arial, Helvetica, sans-serif; fill: #17212b; letter-spacing: 0; }
      .subtitle { font: 400 16px Arial, Helvetica, sans-serif; fill: #50606f; letter-spacing: 0; }
      .section { font: 700 17px Arial, Helvetica, sans-serif; fill: #17212b; letter-spacing: 0; }
      .box-title { font: 700 17px Arial, Helvetica, sans-serif; fill: #17212b; letter-spacing: 0; }
      .body { font: 400 14px Arial, Helvetica, sans-serif; fill: #344453; letter-spacing: 0; }
      .small { font: 400 12.5px Arial, Helvetica, sans-serif; fill: #536270; letter-spacing: 0; }
      .mono { font: 600 12.5px Menlo, Consolas, monospace; fill: #283845; letter-spacing: 0; }
      .white-title { font: 700 17px Arial, Helvetica, sans-serif; fill: #ffffff; letter-spacing: 0; }
      .white-body { font: 400 13.5px Arial, Helvetica, sans-serif; fill: #f4f7f8; letter-spacing: 0; }
      .line { fill: none; stroke: #3d4a57; stroke-width: 2.2; marker-end: url(#arrow); }
      .paper-line { fill: none; stroke: #137c78; stroke-width: 2.4; marker-end: url(#arrow-paper); }
      .sarah-line { fill: none; stroke: #b45f32; stroke-width: 2.4; marker-end: url(#arrow-sarah); }
      .three-line { fill: none; stroke: #4d63a8; stroke-width: 2.4; marker-end: url(#arrow-3d); }
      .dash { fill: none; stroke: #7e8993; stroke-width: 1.8; stroke-dasharray: 7 6; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect x="0" y="0" width="1680" height="1000" fill="#ffffff"/>

  <text x="48" y="54" class="title">PTagent: contract-mediated model construction</text>
  <text x="48" y="82" class="subtitle">Multiple evidence sources, one review boundary, deterministic backend compilation</text>

  <rect x="48" y="108" width="1584" height="86" rx="8" fill="#edf3f4" stroke="#93a8ad" stroke-width="1.5"/>
  <rect x="48" y="108" width="208" height="86" rx="8" fill="#254f59"/>
  <text x="72" y="142" class="white-title">Agent role</text>
  <text x="72" y="167" class="white-body">Limited and review-oriented</text>
  <text x="287" y="141" class="box-title">Route inputs</text>
  <text x="287" y="166" class="body">identify source type</text>
  <line x1="445" y1="126" x2="445" y2="177" stroke="#a6b5b9"/>
  <text x="477" y="141" class="box-title">Organize evidence</text>
  <text x="477" y="166" class="body">summarize with provenance</text>
  <line x1="693" y1="126" x2="693" y2="177" stroke="#a6b5b9"/>
  <text x="725" y="141" class="box-title">Ask focused questions</text>
  <text x="725" y="166" class="body">only unresolved physics choices</text>
  <line x1="980" y1="126" x2="980" y2="177" stroke="#a6b5b9"/>
  <text x="1012" y="141" class="box-title">Explain validation</text>
  <text x="1012" y="166" class="body">blockers and next actions</text>
  <line x1="1247" y1="126" x2="1247" y2="177" stroke="#a6b5b9"/>
  <text x="1279" y="141" class="box-title">No LLM physics code generation</text>
  <text x="1279" y="166" class="body">no guessed masses or couplings</text>

  <text x="48" y="235" class="section">1  Inputs</text>
  <text x="356" y="235" class="section">2  Evidence and deterministic import</text>
  <text x="772" y="235" class="section">3  Reviewed contract</text>
  <text x="1192" y="235" class="section">4  Compilers</text>
  <text x="1460" y="235" class="section">5  Results</text>

  <!-- Input route: paper -->
  <rect x="48" y="264" width="250" height="112" rx="8" fill="#e3f3f0" stroke="#137c78" stroke-width="1.8"/>
  <text x="70" y="295" class="box-title">Paper or user formulas</text>
  <text x="70" y="321" class="body">arXiv · PDF · TeX · Markdown</text>
  <text x="70" y="345" class="body">model choice and benchmark data</text>
  <text x="70" y="365" class="small">Existing workflow retained</text>

  <rect x="356" y="264" width="326" height="112" rx="8" fill="#f4faf8" stroke="#57a9a2" stroke-width="1.5"/>
  <text x="378" y="294" class="box-title">Evidence extraction</text>
  <text x="378" y="320" class="mono">paper_memory · proof_materials</text>
  <text x="378" y="345" class="body">source spans, formulas, assumptions</text>
  <text x="378" y="365" class="small">Ambiguities remain explicit</text>
  <path d="M298,320 C320,320 332,320 352,320" class="paper-line"/>

  <!-- Input route: SARAH -->
  <rect x="48" y="402" width="250" height="152" rx="8" fill="#fbece4" stroke="#b45f32" stroke-width="1.8"/>
  <text x="70" y="433" class="box-title">SARAH / Vevacious++</text>
  <text x="70" y="460" class="mono">MODEL.vin</text>
  <text x="70" y="481" class="mono">ScaleAndBlock.xml</text>
  <text x="70" y="502" class="mono">SLHA / parameters.json</text>
  <text x="70" y="526" class="small">Optional thermal metadata</text>
  <text x="70" y="546" class="small">Optional export-sarah automation</text>

  <rect x="356" y="402" width="326" height="152" rx="8" fill="#fff7f2" stroke="#d69671" stroke-width="1.5"/>
  <text x="378" y="432" class="box-title">Secure SARAH importer</text>
  <text x="378" y="458" class="body">safe XML and expression parsing</text>
  <text x="378" y="481" class="body">tree potential · mass matrices · SLHA</text>
  <text x="378" y="504" class="body">thermal tensors and basis mappings</text>
  <text x="378" y="527" class="small">SHA256 provenance for every source</text>
  <text x="378" y="547" class="small">Missing thermal data → partial import</text>
  <path d="M298,478 C320,478 332,478 352,478" class="sarah-line"/>

  <!-- Input route: 3DEFT -->
  <rect x="48" y="580" width="250" height="126" rx="8" fill="#e9edfa" stroke="#4d63a8" stroke-width="1.8"/>
  <text x="70" y="611" class="box-title">DRalgo / 3DEFT source</text>
  <text x="70" y="638" class="mono">reviewed .m / .wl</text>
  <text x="70" y="663" class="body">soft and ultrasoft EFT output</text>
  <text x="70" y="688" class="small">Existing workflow retained</text>

  <rect x="356" y="580" width="326" height="126" rx="8" fill="#f5f6fc" stroke="#8898cc" stroke-width="1.5"/>
  <text x="378" y="610" class="box-title">Marked source capture</text>
  <text x="378" y="636" class="body">preflight · deterministic wrapper</text>
  <text x="378" y="659" class="body">DRalgo output merge · symbol audit</text>
  <text x="378" y="684" class="small">Reviewed source remains authoritative</text>
  <path d="M298,643 C320,643 332,643 352,643" class="three-line"/>

  <!-- Existing contract route -->
  <rect x="48" y="732" width="250" height="88" rx="8" fill="#f2f4f5" stroke="#687987" stroke-width="1.5"/>
  <text x="70" y="764" class="box-title">Existing contract</text>
  <text x="70" y="791" class="mono">contract_template.md</text>
  <text x="70" y="811" class="small">Human-edited source of truth</text>

  <rect x="356" y="732" width="326" height="88" rx="8" fill="#f8f9fa" stroke="#9ba6ae" stroke-width="1.5"/>
  <text x="378" y="764" class="box-title">Contract parser</text>
  <text x="378" y="790" class="body">structured rows and review states</text>
  <text x="378" y="811" class="small">No reinterpretation of approved formulas</text>
  <path d="M298,776 C320,776 332,776 352,776" class="line"/>

  <!-- Contract and review boundary -->
  <rect x="758" y="285" width="366" height="520" rx="8" fill="#ffffff" stroke="#243746" stroke-width="2.2"/>
  <rect x="758" y="285" width="366" height="58" rx="8" fill="#243746"/>
  <rect x="758" y="327" width="366" height="16" fill="#243746"/>
  <text x="786" y="320" class="white-title">Human-reviewable model contract</text>

  <text x="786" y="379" class="box-title">Source-derived content</text>
  <text x="786" y="404" class="body">potential · fields · parameters · spectra</text>
  <text x="786" y="427" class="body">thermal matrices · conventions · hashes</text>
  <line x1="786" y1="447" x2="1096" y2="447" stroke="#c5cdd2"/>

  <text x="786" y="481" class="box-title">One physics-policy review</text>
  <text x="786" y="507" class="body">species inclusion · resummation</text>
  <text x="786" y="530" class="body">Goldstone/photon/gauge policy</text>
  <text x="786" y="553" class="body">counterterms · symmetry · backend</text>
  <line x1="786" y1="575" x2="1096" y2="575" stroke="#c5cdd2"/>

  <rect x="786" y="602" width="310" height="83" rx="6" fill="#eef3f6" stroke="#8194a1"/>
  <text x="808" y="631" class="box-title">Deterministic validation</text>
  <text x="808" y="655" class="body">dimensions · dof · parameters · alignment</text>
  <text x="808" y="676" class="small">Unresolved information remains a blocker</text>

  <rect x="786" y="710" width="310" height="66" rx="6" fill="#fff3cf" stroke="#c39622" stroke-width="1.5"/>
  <text x="808" y="739" class="box-title">Human compile approval</text>
  <text x="808" y="762" class="small">Required after the final contract review</text>

  <path d="M682,320 C718,320 724,375 754,375" class="paper-line"/>
  <path d="M682,478 C718,478 724,478 754,478" class="sarah-line"/>
  <path d="M682,643 C718,643 724,580 754,580" class="three-line"/>
  <path d="M682,776 C720,776 730,735 754,735" class="line"/>

  <!-- Compilers -->
  <rect x="1188" y="348" width="216" height="142" rx="8" fill="#e5f1f5" stroke="#32748c" stroke-width="1.8"/>
  <text x="1212" y="382" class="box-title">CosmoTransitions</text>
  <text x="1212" y="409" class="body">generated Python model</text>
  <text x="1212" y="432" class="body">matrix eigensystems</text>
  <text x="1212" y="455" class="body">potential and phase history</text>
  <text x="1212" y="477" class="small">import and runtime smoke tests</text>

  <rect x="1188" y="540" width="216" height="142" rx="8" fill="#f5e9ef" stroke="#985372" stroke-width="1.8"/>
  <text x="1212" y="574" class="box-title">PhaseTracer</text>
  <text x="1212" y="601" class="body">generated C++ project</text>
  <text x="1212" y="624" class="body">Eigen self-adjoint solvers</text>
  <text x="1212" y="647" class="body">native potential interfaces</text>
  <text x="1212" y="669" class="small">configure, build, and smoke tests</text>

  <path d="M1124,478 C1152,478 1155,419 1184,419" class="line"/>
  <path d="M1124,616 C1152,616 1155,611 1184,611" class="line"/>

  <!-- Results -->
  <rect x="1460" y="350" width="172" height="332" rx="8" fill="#f4f6f7" stroke="#526472" stroke-width="1.8"/>
  <text x="1484" y="386" class="box-title">Auditable outputs</text>
  <line x1="1484" y1="404" x2="1608" y2="404" stroke="#b1bbc2"/>
  <text x="1484" y="438" class="body">backend code</text>
  <text x="1484" y="469" class="body">validation reports</text>
  <text x="1484" y="500" class="body">mass spectra</text>
  <text x="1484" y="531" class="body">finite-T potential</text>
  <text x="1484" y="562" class="body">phase histories</text>
  <text x="1484" y="593" class="body">critical transitions</text>
  <text x="1484" y="624" class="body">runtime logs</text>
  <text x="1484" y="655" class="small">Tc/Tn only after</text>
  <text x="1484" y="673" class="small">successful backend runs</text>

  <path d="M1404,419 C1427,419 1435,448 1456,448" class="line"/>
  <path d="M1404,611 C1427,611 1435,585 1456,585" class="line"/>

  <!-- Bottom guardrail -->
  <rect x="48" y="864" width="1584" height="88" rx="8" fill="#17212b"/>
  <text x="72" y="897" class="white-title">Deterministic boundary</text>
  <text x="72" y="926" class="white-body">No external model API key</text>
  <circle cx="337" cy="908" r="3" fill="#7fc8c1"/>
  <text x="357" y="913" class="white-body">No LLM-derived mass matrices or thermal self-energies</text>
  <circle cx="804" cy="908" r="3" fill="#dca07d"/>
  <text x="824" y="913" class="white-body">Missing source data stays blocked</text>
  <circle cx="1116" cy="908" r="3" fill="#9eabd7"/>
  <text x="1136" y="913" class="white-body">Every artifact retains provenance</text>

  <text x="48" y="982" class="small">Colored arrows preserve the paper, SARAH, and 3DEFT evidence routes until they meet at the shared reviewed contract.</text>
</svg>
